device: 'cuda:2'

train_param:
  lr: 0.01
  weight_decay: 5e-4

  epochs: 200
  initialize: True
  verbose: True
  patience: 100


model:

  with_relu: True
  with_bias: True

  hidden_channels: 128


  original_x: True
  adaptive: True
  n_node: 3059

  Pure_GNNConv:
    layer_1:
      message_component:
        name: cos_sim
        additive:
          requires_grad: True

      aggegator_component:
        aggregators: ['sum','max','min']
        attention: 'dot'
        with_attention: True
      updator_component: const


    layer_2:
      message_component:
        name: cos_sim

        additive:
          requires_grad: True

      aggegator_component:
        aggregators: ['sum']
      updator_component: const
