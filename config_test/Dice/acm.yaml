device: 'cuda:0'

train_param:
  lr: 0.01
  weight_decay: 5e-4

  epochs: 200
  initialize: True
  verbose: True
  patience: 100


model:

  with_relu: True
  with_bias: True

  hidden_channels: 128



  original_x: True
  adaptive: False #
  n_node: 2006

  Pure_GNNConv:
    layer_1:
      message_component:
        name: cos_sim
        additive:
          requires_grad: True

      aggegator_component:
        aggregators: ['sum','max','min']

        attention: 'dot'
        with_attention: True

      updator_component: const_1


    layer_2:
      message_component:
        name: cos_sim
        additive:
          requires_grad: True

      aggegator_component:
        aggregators: ['sum']

      updator_component: const
